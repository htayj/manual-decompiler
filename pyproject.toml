[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lispmdoc"
version = "0.1.0.dev0"
description = "Decompile historical manual PDFs into structured text, vectors, and scoped raster assets"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "lispmdoc contributors" }]
dependencies = [
  "jsonschema>=4.23",
  "Pillow>=10",
  "fonttools>=4.63",
  "pypdf>=5",
  "PyYAML>=6",
  "uharfbuzz>=0.55",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.9",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6",
]

[project.scripts]
lispmdoc = "lispmdoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lispmdoc"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lispmdoc"]
